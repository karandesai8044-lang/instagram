<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up • Instagram</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-spacer"></div>

  <div class="container">
    <div class="login-box subpage-box">
      <h1 class="logo">Instagram</h1>
      <h2 class="subpage-title">Create account</h2>

      <form class="subpage-form">
        <div class="input-wrap">
          <input type="text" placeholder="Mobile Number or Email" value="">
        </div>
        <div class="input-wrap">
          <input type="text" placeholder="Full Name" value="">
        </div>
        <div class="input-wrap">
          <input type="text" placeholder="Username" value="">
        </div>
        <div class="input-wrap">
          <input type="password" placeholder="Password" value="">
        </div>
        <button type="button" class="login-btn">Sign up</button>
      </form>

      <a href="index.html" class="subpage-link">Back to login</a>
    </div>
  </div>
</body>
</html>
