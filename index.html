<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-spacer"></div>

<div class="container">
  <div class="login-box">
    <h1 class="logo">Instagram</h1>

    <div id="banner" class="banner hidden"></div>

    <form id="loginForm" autocomplete="off">
      <div class="input-wrap">
        <input type="text" id="username" placeholder="Phone number, username, or email" autocapitalize="off">
      </div>
      <div class="input-wrap password-wrap">
        <input type="password" id="password" placeholder="Password">
        <button type="button" id="togglePass" class="toggle-pass">Show</button>
      </div>
      <button type="submit" id="loginBtn" class="login-btn" disabled>Log in</button>
    </form>

    <div class="divider"><span>OR</span></div>

    <a href="#" class="fb-login">
      <svg class="fb-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="#385185" d="M22 12.06C22 6.49 17.52 2 12 2S2 6.49 2 12.06C2 17.06 5.66 21.2 10.44 22v-7.03H7.9v-2.91h2.54V9.84c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.44 2.91h-2.34V22C18.34 21.2 22 17.06 22 12.06z"/></svg>
      Log in with Facebook
    </a>

    <a href="#" class="forgot-link">Forgot password?</a>
  </div>

  <div class="signup-box">
    <span>Don't have an account? <a href="#">Sign up</a></span>
  </div>

  <div class="get-app-box">
    <p>Get the app.</p>
    <div class="app-badges">
      <a href="#" class="badge">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17.01 2.94 12.68 4.7 9.74c.87-1.46 2.43-2.38 4.12-2.4 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.27-2.15 3.78.03 3 2.65 4 2.68 4.01-.03.07-.42 1.44-1.38 2.84zM13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span>App Store</span>
      </a>
      <a href="#" class="badge">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M3.6 2.4c-.3.3-.5.8-.5 1.3v16.6c0 .5.2 1 .5 1.3l9.4-9.6L3.6 2.4zm12.1 9.6l2.5-2.5-11-6.3 8.5 8.8zm0 .6l-8.5 8.8 11-6.3-2.5-2.5zm1-.6l2.9 1.7c.5.3.8.8.8 1.3s-.3 1-.8 1.3l-2.9 1.7-2.8-2.9 2.8-3.1z"/></svg>
        <span>Google Play</span>
      </a>
    </div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Locations</a>
      <a href="#">Instagram Lite</a>
      <a href="#">Threads</a>
      <a href="#">Contact Uploading &amp; Non-Users</a>
      <a href="#">Meta Verified</a>
    </div>
    <div class="footer-bottom">
      <select id="langSelect" class="lang-select">
        <option>English</option>
        <option>हिन्दी</option>
        <option>ગુજરાતી</option>
        <option>Español</option>
        <option>Français</option>
        <option>Português</option>
      </select>
      <span class="copyright">© 2026 Instagram from Meta</span>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
