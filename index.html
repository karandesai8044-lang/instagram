<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry • Karan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-size='38' font-family='Arial, sans-serif' font-weight='700' fill='white'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-spacer"></div>

<div class="container">
  <div class="login-box">
    <h1 class="logo">Karan</h1>
    <p class="subheading">Send your enquiry</p>

    <div id="banner" class="banner hidden"></div>

    <div id="loadingOverlay" class="loading-overlay hidden" aria-live="polite" aria-busy="true">
      <div class="spinner"></div>
    </div>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name">
        <small id="fullNameError" class="error-message"></small>
      </div>

      <div class="field-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
        <small id="emailError" class="error-message"></small>
      </div>

      <div class="field-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel">
        <small id="phoneError" class="error-message"></small>
      </div>

      <div class="field-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us how we can help..."></textarea>
        <small id="messageError" class="error-message"></small>
      </div>

      <button type="submit" id="loginBtn" class="login-btn" disabled>Submit enquiry</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
